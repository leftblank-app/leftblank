[package]
name = "leftblank-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
subtle = "2"
