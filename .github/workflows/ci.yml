name: build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: Mac regression
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: preview
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Strict SwiftFormat and SwiftLint
        run: scripts/lint.sh
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Functional integration tests and 80% coverage gate
        run: scripts/test.sh
      - name: Download and verify Codecov CLI
        id: codecov-cli
        if: ${{ !cancelled() && hashFiles('build/coverage/codecov.lcov') != '' }}
        run: scripts/prepare-codecov.sh
      - name: Upload application coverage to Codecov
        if: ${{ !cancelled() && steps.codecov-cli.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          # prepare-codecov.sh verifies the pinned SHA-256 before execution.
          binary: .tools/codecov
          # Fork PRs use Codecov's public-repository tokenless upload support.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: build/coverage/codecov.lcov
          disable_search: true
          disable_file_fixes: true
          plugins: noop
          fail_ci_if_error: true
          name: macos-apple-silicon
          flags: macos
      - name: Real book editing and navigation benchmarks
        run: scripts/benchmark-books.sh
      - name: Upload book performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book-performance-macos-15
          path: build/benchmarks
          if-no-files-found: warn
          retention-days: 14
      - name: Release automation contracts
        run: |
          source scripts/environment.sh
          python3 scripts/test-preview-release.py
          python3 scripts/test-appstore-release.py
          python3 scripts/test-running-app.py
      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/coverage/summary.md ]; then
            cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/benchmarks/summary.md ]; then
            cat build/benchmarks/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-macos-15
          path: build/coverage
          if-no-files-found: warn
          retention-days: 14
  appstore:
    name: Mac App Store validation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: appstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: appstore-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-
      - name: Verify App Store build excludes the updater
        run: |
          source scripts/environment.sh
          LEFTBLANK_INTEGRATION=1 swift test -Xswiftc -warnings-as-errors --filter distributionUsesMatchingAppIdentity
          binary="$(swift build --show-bin-path)/LeftBlank"
          if otool -L "$binary" | grep -q Sparkle; then
            echo 'App Store binary unexpectedly links Sparkle.' >&2
            exit 1
          fi
  memory:
    name: Memory safety (${{ matrix.check }})
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [leaks, address]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: memory-${{ matrix.check }}-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
      - name: Check memory
        run: scripts/check-memory.sh "${{ matrix.check }}"
      - name: Upload memory diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-${{ matrix.check }}-macos-15
          path: build/memory
          if-no-files-found: warn
          retention-days: 14
  preview:
    name: Signed preview
    needs: [integration, appstore]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact-name: ${{ steps.package-name.outputs.name }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: preview
      LEFTBLANK_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Identify this package
        id: package-name
        run: echo "name=LeftBlank-Preview-${LEFTBLANK_BUILD_NUMBER}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: preview-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
      - name: Sign, notarize and prepare the update
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ICLOUD_PREVIEW_PROVISIONING_PROFILE: ${{ secrets.ICLOUD_PREVIEW_PROVISIONING_PROFILE }}
        run: scripts/release.sh
      - name: Cold-launch the signed package
        run: |
          source scripts/environment.sh
          python3 scripts/smoke-app.py --app 'build/LeftBlank Preview.app' --development-resources "$(swift build -c release --show-bin-path)/LeftBlank_LeftBlankCore.bundle"
      - name: Upload runnable app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package-name.outputs.name }}
          path: |
            build/release/*.zip
            build/release/*.sha256
            build/release/appcast.xml
          if-no-files-found: error
          retention-days: 7
      - name: Release diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-diagnostics
          path: |
            build/notarization
            build/launch-smoke
          if-no-files-found: ignore
          retention-days: 7
  publish-preview:
    name: Publish preview update
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: preview-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preview.outputs.artifact-name }}
          path: build/release
      - name: Publish versioned package and signed feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-preview.py
  ipad-build:
    name: iPad ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: engine
            name: engine
          - platform: simulator
            name: simulator build
          - platform: device
            name: device
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: appstore
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache engine sources and platform build
        id: engine-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-ipad
            .tools/tinymist-ipad-source
            Engine/TinymistBridge/target
          key: ipad-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/TinymistBridge/Cargo.lock', 'Engine/TinymistBridge/Cargo.toml', 'Engine/TinymistBridge/src/**', 'Engine/TinymistBridge/examples/**', 'scripts/tinymist-ipad*.patch', 'scripts/prepare-ipad-engine.sh') }}
          restore-keys: |
            ipad-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.92.0-xcode-26.3-
      - name: Cache Swift package sources
        id: swift-cache
        if: matrix.platform != 'engine'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/xcode-packages
          key: ipad-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Sources/Package.swift', 'iPad/**/Package.resolved') }}
      - name: In-process engine integration
        if: matrix.platform == 'engine'
        run: scripts/test-ipad-engine.sh
      - name: Rust bridge correctness lints
        if: matrix.platform == 'engine'
        run: |
          source scripts/environment.sh
          export CARGO_HOME="$PWD/.tools/cargo-ipad"
          rustup component add --toolchain 1.92.0 rustfmt clippy
          cargo +1.92.0 fmt --manifest-path Engine/TinymistBridge/Cargo.toml --check
          cargo +1.92.0 clippy --locked --release --manifest-path Engine/TinymistBridge/Cargo.toml --all-targets --no-deps -- -D warnings -D unsafe_op_in_unsafe_fn
      - name: Simulator, coverage and iPad package contracts
        if: matrix.platform == 'engine'
        timeout-minutes: 2
        run: |
          source scripts/environment.sh
          python3 scripts/test-ipad-simulator.py
          python3 scripts/test-ipad-coverage.py
          python3 scripts/test-package-graphs.py
          python3 scripts/test-ipad-release.py
          python3 scripts/test-ipad-storefront.py
      - name: Build native iPad app
        if: matrix.platform != 'engine'
        run: scripts/build-ipad.sh "${{ matrix.platform }}"
      # Save successful compilation before UI tests: a failing test must not
      # discard a 15-minute Rust build and force another cold build on retry.
      - name: Save compiled engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: |
            .tools/cargo-ipad
            .tools/tinymist-ipad-source
            Engine/TinymistBridge/target
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Save resolved Swift packages
        if: matrix.platform != 'engine' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: .build/xcode-packages
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
      # Keep executable permissions and symlinks inside an archive. Both UI
      # runners consume this one build, including its relocatable .xctestrun.
      - name: Archive compiled simulator tests
        if: matrix.platform == 'simulator'
        timeout-minutes: 3
        run: |
          source scripts/environment.sh
          COPYFILE_DISABLE=1 tar -C build/iPad/Build -czf build/iPad-ui-tests.tar.gz Products
      - name: Upload compiled simulator tests
        if: matrix.platform == 'simulator'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: ipad-ui-tests
          path: build/iPad-ui-tests.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  ipad-ui:
    name: iPad UI (${{ matrix.size }}, ${{ matrix.appearance }})
    needs: ipad-build
    runs-on: macos-15
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - size: 11-inch
            appearance: light
          - size: 13-inch
            appearance: dark
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode for simulator services
        timeout-minutes: 1
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Download compiled simulator tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 3
        with:
          name: ipad-ui-tests
          path: build
      - name: Restore compiled simulator tests
        timeout-minutes: 2
        run: |
          source scripts/environment.sh
          mkdir -p build/iPad/Build
          tar -xzf build/iPad-ui-tests.tar.gz -C build/iPad/Build
      - name: Native unit tests, writing, preview navigation, catalog and PDF sharing
        # Cold boot + up to 10m test-host launch + 18m execution + diagnostics.
        timeout-minutes: 40
        run: |
          source scripts/environment.sh
          python3 scripts/ipad_simulator.py --fresh-device --size "${{ matrix.size }}" \
            --appearance "${{ matrix.appearance }}"
      - name: Upload native iPad test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 3
        with:
          name: ipad-writing-${{ matrix.size }}-${{ matrix.appearance }}
          path: build/iPad-writing
          if-no-files-found: warn
          retention-days: 14
  ipad-coverage:
    name: iPad 80% application coverage
    needs: ipad-ui
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download native test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ipad-writing-*
          path: build/iPad-results
      - name: Merge actual execution counts and require 80% coverage
        run: |
          source scripts/environment.sh
          python3 scripts/ipad_coverage.py --minimum 80 --result \
            build/iPad-results/ipad-writing-11-inch-light/11-inch.xcresult \
            build/iPad-results/ipad-writing-13-inch-dark/13-inch.xcresult
      - name: Download and verify Codecov CLI
        id: codecov-cli
        if: ${{ !cancelled() && hashFiles('build/iPad-coverage/codecov.lcov') != '' }}
        run: scripts/prepare-codecov.sh
      - name: Upload iPad application coverage to Codecov
        if: ${{ !cancelled() && steps.codecov-cli.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: .tools/codecov
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: build/iPad-coverage/codecov.lcov
          flags: ipad
          name: ipad-swift-application
          disable_search: true
          disable_file_fixes: true
          plugins: noop
          fail_ci_if_error: true
      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/iPad-coverage/summary.md ]; then
            cat build/iPad-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload iPad coverage diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipad-coverage
          path: build/iPad-coverage
          if-no-files-found: warn
          retention-days: 14
  ipad-memory:
    name: iPad memory safety (${{ matrix.check }})
    needs: ipad-build
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [lifecycle, address, thread]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: appstore
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode for simulator services
        run: sudo xcode-select --switch "$DEVELOPER_DIR"
      - name: Download compiled lifecycle tests
        if: matrix.check == 'lifecycle'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ipad-ui-tests
          path: build
      - name: Restore compiled lifecycle tests
        if: matrix.check == 'lifecycle'
        run: |
          source scripts/environment.sh
          mkdir -p build/iPad/Build
          tar -xzf build/iPad-ui-tests.tar.gz -C build/iPad/Build
      - name: Reuse compiled Rust engine
        if: matrix.check != 'lifecycle'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-ipad
            .tools/tinymist-ipad-source
            Engine/TinymistBridge/target
          key: ipad-${{ runner.os }}-${{ runner.arch }}-simulator-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/TinymistBridge/Cargo.lock', 'Engine/TinymistBridge/Cargo.toml', 'Engine/TinymistBridge/src/**', 'Engine/TinymistBridge/examples/**', 'scripts/tinymist-ipad*.patch', 'scripts/prepare-ipad-engine.sh') }}
          restore-keys: |
            ipad-${{ runner.os }}-${{ runner.arch }}-simulator-rust-1.92.0-xcode-26.3-
      - name: Reuse resolved Swift packages
        if: matrix.check != 'lifecycle'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/xcode-packages
          key: ipad-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Sources/Package.swift', 'iPad/**/Package.resolved') }}
      - name: Build separate sanitizer test products
        if: matrix.check != 'lifecycle'
        run: scripts/build-ipad.sh simulator "${{ matrix.check }}"
      - name: Repeated ownership lifecycle and memory metrics
        if: matrix.check == 'lifecycle'
        timeout-minutes: 25
        run: |
          source scripts/environment.sh
          python3 scripts/ipad_simulator.py --size 11-inch --suite unit --memory \
            --results build/iPad-memory/lifecycle-results
      - name: Check Swift memory corruption and data races separately
        if: matrix.check != 'lifecycle'
        timeout-minutes: 25
        run: |
          source scripts/environment.sh
          python3 scripts/ipad_simulator.py --size 11-inch --suite unit --no-coverage \
            --derived-data "build/iPad-memory/${{ matrix.check }}" \
            --results "build/iPad-memory/${{ matrix.check }}-results"
      - name: Upload iPad memory diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipad-memory-${{ matrix.check }}
          path: build/iPad-memory/*-results
          if-no-files-found: warn
          retention-days: 14
  gate:
    name: build and test
    needs: [integration, appstore, ipad-build, ipad-ui, ipad-coverage, ipad-memory]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require Mac and iPad validation to pass
        env:
          MAC_RESULT: ${{ needs.integration.result }}
          APPSTORE_RESULT: ${{ needs.appstore.result }}
          APPSTORE_REQUIRED: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          IPAD_BUILD_RESULT: ${{ needs.ipad-build.result }}
          IPAD_UI_RESULT: ${{ needs.ipad-ui.result }}
          IPAD_COVERAGE_RESULT: ${{ needs.ipad-coverage.result }}
          IPAD_MEMORY_RESULT: ${{ needs.ipad-memory.result }}
        run: |
          test "$MAC_RESULT" = success
          if [ "$APPSTORE_REQUIRED" = true ]; then
            test "$APPSTORE_RESULT" = success
          else
            test "$APPSTORE_RESULT" = skipped
          fi
          test "$IPAD_BUILD_RESULT" = success
          test "$IPAD_UI_RESULT" = success
          test "$IPAD_COVERAGE_RESULT" = success
          test "$IPAD_MEMORY_RESULT" = success
