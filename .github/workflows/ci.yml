name: build and test

on:
  push:
    branches: [main]
  pull_request:
  # Nightly full iPad suite at 18:00 UTC (02:00 Beijing).
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      ipad_suite:
        description: iPad validation depth
        type: choice
        options: [full, smoke]
        default: full
      publish_preview:
        description: Run only the Mac checks on main and publish LeftBlank Preview (ignores ipad_suite)
        type: boolean
        default: false

permissions:
  contents: read

# GitHub Free gives the organization about five concurrent macOS runners, so
# each run selects only what its changes need:
# - The `changes` job diffs changed paths (scripts/ci_changes.py): Mac-only
#   changes skip the iPad jobs, iPad-only changes skip Mac regression, shared
#   code runs both and docs-only changes run no macOS job. Pull requests diff
#   against their base; main pushes against the last successful main run, so a
#   cancelled or failed run's changes stay selected.
# - Pull requests and main pushes run exactly the same checks: the selected
#   Mac regression and iPad smoke suite (native unit tests plus a few curated
#   UI scenarios on one 11-inch simulator).
# - The nightly schedule on main runs everything: the full iPad suite (every
#   UI scenario on both sizes, coverage, memory metrics and sanitizers), Mac App
#   Store validation and Mac memory safety, then signs and publishes LeftBlank
#   Preview once Mac regression and App Store validation pass. It skips only
#   when this commit already had a fully successful nightly.
# - Manual dispatches run everything at the `ipad_suite` depth (default full);
#   on main they add the App Store and memory checks. `publish_preview` on main
#   runs only the Mac checks and publishes Preview between nightlies.
# - A newer run cancels an older one with the same event and ref, so pushes
#   never cancel nightly or manual runs. A cancelled publication is harmless:
#   at worst it leaves a build release that the next publication supersedes.
# The `build and test` gate is the only required check; it accepts a skipped
# job only when the selection did not require it. Job conditions repeat the
# suite test because workflow env is unavailable there.
env:
  IPAD_SUITE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.ipad_suite != 'smoke')) && 'full' || 'smoke' }}

# Keep only the newest run per ref and event: the event name keeps main
# pushes from cancelling nightly and manual runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mac: ${{ steps.select.outputs.mac }}
      ipad: ${{ steps.select.outputs.ipad }}
      suite: ${{ steps.select.outputs.suite }}
      release: ${{ steps.select.outputs.release }}
      publish: ${{ steps.select.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - name: CI policy contracts
        run: python3 scripts/test-ci-policy.py
      - name: Select jobs from changed paths
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUBLISH_PREVIEW: ${{ inputs.publish_preview }}
        run: python3 scripts/ci_changes.py select
  integration:
    name: Mac regression
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: preview
    # Leaves room for one cold patched Tinymist build after its inputs change.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Strict SwiftFormat and SwiftLint
        run: scripts/lint.sh
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Cache parser dependencies and library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-syntax
            Engine/SyntaxBridge/target
          key: syntax-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/SyntaxBridge/Cargo.lock', 'Engine/SyntaxBridge/Cargo.toml', 'Engine/SyntaxBridge/src/**') }}
          restore-keys: |
            syntax-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-
      - name: Cache MCP dependencies and helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-mcp
            Tools/MCPServer/target
          key: mcp-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-${{ hashFiles('Tools/MCPServer/Cargo.lock') }}
      - name: Prepare pinned Hurl and validate Rust bridge
        run: |
          source scripts/environment.sh
          scripts/prepare-mcp-hurl.sh
          scripts/build-mcp.sh
          export CARGO_HOME="$PWD/.tools/cargo-mcp"
          cargo +1.92.0 fmt --manifest-path Tools/MCPServer/Cargo.toml --check
          cargo +1.92.0 clippy --locked --manifest-path Tools/MCPServer/Cargo.toml --all-targets --no-deps -- -D warnings
          cargo +1.92.0 test --locked --manifest-path Tools/MCPServer/Cargo.toml
      # Only the patched helper is cached; a miss (patch or script change) runs a
      # cold Rust build, saved before tests so a failing test does not repeat it.
      - name: Restore patched Tinymist
        id: tinymist-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/tinymist
            .tools/tinymist.stamp
          key: mac-tinymist-0.15.8-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-${{ hashFiles('scripts/build-tinymist.sh', 'scripts/tinymist-native-tls.patch', 'scripts/tinymist-vfs.patch') }}
      - name: Build patched Tinymist
        timeout-minutes: 40
        run: scripts/build-tinymist.sh
      - name: Save patched Tinymist
        if: steps.tinymist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: |
            .tools/tinymist
            .tools/tinymist.stamp
          key: ${{ steps.tinymist-cache.outputs.cache-primary-key }}
      - name: Build and validate the parser bridge
        run: |
          source scripts/environment.sh
          scripts/build-syntax.sh
          export CARGO_HOME="$PWD/.tools/cargo-syntax"
          cargo +1.92.0 fmt --manifest-path Engine/SyntaxBridge/Cargo.toml --check
          cargo +1.92.0 clippy --locked --manifest-path Engine/SyntaxBridge/Cargo.toml --all-targets --no-deps -- -D warnings -D unsafe_op_in_unsafe_fn
          cargo +1.92.0 test --locked --manifest-path Engine/SyntaxBridge/Cargo.toml
      - name: Functional integration tests and 80% coverage gate
        run: scripts/test.sh
      - name: Crash reports
        if: failure()
        run: |
          shopt -s nullglob
          for report in ~/Library/Logs/DiagnosticReports/*.ips; do
            echo "== $report"
            python3 -c 'import json,sys; t=open(sys.argv[1]).read().split("\n",1); d=json.loads(t[1]); th=[x for x in d.get("threads",[]) if x.get("triggered")] or d.get("threads",[])[:1]; imgs=d.get("usedImages",[]); [print(f.get("symbol","?"), "+", f.get("symbolLocation",0), imgs[f["imageIndex"]].get("name","?") if "imageIndex" in f else "") for x in th for f in x.get("frames",[])[:60]]; print(d.get("exception"))' "$report" || head -c 4000 "$report"
          done
      # Codecov uploads are temporarily disabled while CLI downloads fail TLS handshakes.
      - name: Real book editing and navigation benchmarks
        run: scripts/benchmark-books.sh
      - name: Upload book performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book-performance-macos-15
          path: build/benchmarks
          if-no-files-found: warn
          retention-days: 14
      - name: Release automation contracts
        run: |
          source scripts/environment.sh
          python3 scripts/test-preview-release.py
          python3 scripts/test-appstore-release.py
          python3 scripts/test-running-app.py
          python3 scripts/test-tinymist-build.py
      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/coverage/summary.md ]; then
            cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/benchmarks/summary.md ]; then
            cat build/benchmarks/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-macos-15
          path: build/coverage
          if-no-files-found: warn
          retention-days: 14
  appstore:
    name: Mac App Store validation
    # Nightly and manual main runs only; `release` implies Mac jobs are selected.
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: appstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: appstore-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-
      - name: Cache parser dependencies and library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-syntax
            Engine/SyntaxBridge/target
          key: syntax-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/SyntaxBridge/Cargo.lock', 'Engine/SyntaxBridge/Cargo.toml', 'Engine/SyntaxBridge/src/**') }}
          restore-keys: |
            syntax-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-
      - name: Verify App Store build excludes the updater
        run: |
          source scripts/environment.sh
          scripts/build-syntax.sh
          LEFTBLANK_INTEGRATION=1 swift test -Xswiftc -warnings-as-errors --filter distributionUsesMatchingAppIdentity
          binary="$(swift build --show-bin-path)/LeftBlank"
          if otool -L "$binary" | grep -q Sparkle; then
            echo 'App Store binary unexpectedly links Sparkle.' >&2
            exit 1
          fi
  memory:
    name: Memory safety (${{ matrix.check }})
    # Nightly and manual main runs only; `release` implies Mac jobs are selected.
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [leaks, address]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: preview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: memory-${{ matrix.check }}-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
      - name: Cache parser dependencies and library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-syntax
            Engine/SyntaxBridge/target
          key: syntax-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/SyntaxBridge/Cargo.lock', 'Engine/SyntaxBridge/Cargo.toml', 'Engine/SyntaxBridge/src/**') }}
          restore-keys: |
            syntax-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-
      - name: Check memory
        run: scripts/check-memory.sh "${{ matrix.check }}"
      - name: Upload memory diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-${{ matrix.check }}-macos-15
          path: build/memory
          if-no-files-found: warn
          retention-days: 14
  # Preview publishes from the nightly run, or on demand from a main dispatch
  # with publish_preview. It depends on Mac validation only: an iPad failure
  # fails the gate and is reported, but does not hold back the Mac preview.
  preview:
    name: Signed preview
    needs: [changes, integration, appstore]
    if: needs.changes.outputs.publish == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact-name: ${{ steps.package-name.outputs.name }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: preview
      LEFTBLANK_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Identify this package
        id: package-name
        run: echo "name=LeftBlank-Preview-${LEFTBLANK_BUILD_NUMBER}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: preview-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
      # Only the patched helper is cached; a miss (patch or script change) runs a
      # cold Rust build, saved before tests so a failing test does not repeat it.
      - name: Restore patched Tinymist
        id: tinymist-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/tinymist
            .tools/tinymist.stamp
          key: mac-tinymist-0.15.8-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-${{ hashFiles('scripts/build-tinymist.sh', 'scripts/tinymist-native-tls.patch', 'scripts/tinymist-vfs.patch') }}
      - name: Build patched Tinymist
        timeout-minutes: 40
        run: scripts/build-tinymist.sh
      - name: Save patched Tinymist
        if: steps.tinymist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: |
            .tools/tinymist
            .tools/tinymist.stamp
          key: ${{ steps.tinymist-cache.outputs.cache-primary-key }}
      - name: Cache parser dependencies and library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-syntax
            Engine/SyntaxBridge/target
          key: syntax-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/SyntaxBridge/Cargo.lock', 'Engine/SyntaxBridge/Cargo.toml', 'Engine/SyntaxBridge/src/**') }}
          restore-keys: |
            syntax-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-xcode-26.3-
      - name: Sign, notarize and prepare the update
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ICLOUD_PREVIEW_PROVISIONING_PROFILE: ${{ secrets.ICLOUD_PREVIEW_PROVISIONING_PROFILE }}
        run: scripts/release.sh
      - name: Cold-launch the signed package
        run: |
          source scripts/environment.sh
          python3 scripts/smoke-app.py --app 'build/LeftBlank Preview.app' --development-resources "$(swift build -c release --show-bin-path)/LeftBlank_LeftBlankCore.bundle"
      - name: Upload runnable app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package-name.outputs.name }}
          path: |
            build/release/*.zip
            build/release/*.sha256
            build/release/appcast.xml
          if-no-files-found: error
          retention-days: 7
      - name: Release diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-diagnostics
          path: |
            build/notarization
            build/launch-smoke
          if-no-files-found: ignore
          retention-days: 7
  publish-preview:
    name: Publish preview update
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: preview-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preview.outputs.artifact-name }}
          path: build/release
      - name: Publish versioned package and signed feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-preview.py
  ipad-build:
    name: iPad ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.ipad == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [engine, device]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: appstore
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Mac regression normally lints the whole repository; lint here when an
      # iPad-only change skips it.
      - name: Strict SwiftFormat and SwiftLint
        if: matrix.platform == 'engine' && needs.changes.outputs.mac != 'true'
        run: scripts/lint.sh
      - name: Cache engine sources and platform build
        id: engine-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-ipad
            .tools/tinymist-ipad-source
            Engine/TinymistBridge/target
          key: ipad-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/TinymistBridge/Cargo.lock', 'Engine/TinymistBridge/Cargo.toml', 'Engine/TinymistBridge/src/**', 'Engine/TinymistBridge/examples/**', 'Engine/SyntaxBridge/Cargo.toml', 'Engine/SyntaxBridge/src/**', 'scripts/tinymist-ipad*.patch', 'scripts/tinymist-vfs.patch', 'scripts/prepare-ipad-engine.sh') }}
          restore-keys: |
            ipad-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-rust-1.92.0-xcode-26.3-
      - name: Cache Swift package sources
        id: swift-cache
        if: matrix.platform != 'engine'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/xcode-packages
          key: ipad-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Sources/Package.swift', 'iPad/**/Package.resolved') }}
      - name: In-process engine integration
        if: matrix.platform == 'engine'
        run: scripts/test-ipad-engine.sh
      - name: Rust bridge correctness lints
        if: matrix.platform == 'engine'
        run: |
          source scripts/environment.sh
          export CARGO_HOME="$PWD/.tools/cargo-ipad"
          rustup component add --toolchain 1.92.0 rustfmt clippy
          cargo +1.92.0 fmt --manifest-path Engine/TinymistBridge/Cargo.toml --check
          cargo +1.92.0 clippy --locked --release --manifest-path Engine/TinymistBridge/Cargo.toml --all-targets --no-deps -- -D warnings -D unsafe_op_in_unsafe_fn
      - name: Simulator, coverage and iPad package contracts
        if: matrix.platform == 'engine'
        timeout-minutes: 2
        run: |
          source scripts/environment.sh
          python3 scripts/test-ipad-simulator.py
          python3 scripts/test-ipad-coverage.py
          python3 scripts/test-package-graphs.py
          python3 scripts/test-ipad-release.py
          python3 scripts/test-ipad-storefront.py
      - name: Build native iPad app
        if: matrix.platform != 'engine'
        run: scripts/build-ipad.sh "${{ matrix.platform }}"
      # Save successful compilation even when a later check fails, so a retry
      # does not repeat a 15-minute cold Rust build.
      - name: Save compiled engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: |
            .tools/cargo-ipad
            .tools/tinymist-ipad-source
            Engine/TinymistBridge/target
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Save resolved Swift packages
        if: matrix.platform != 'engine' && steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: .build/xcode-packages
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
  ipad-simulator-build:
    name: iPad simulator build
    needs: changes
    if: needs.changes.outputs.ipad == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: appstore
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache engine sources and simulator build
        id: engine-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-ipad
            .tools/tinymist-ipad-source
            Engine/TinymistBridge/target
          key: ipad-${{ runner.os }}-${{ runner.arch }}-simulator-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/TinymistBridge/Cargo.lock', 'Engine/TinymistBridge/Cargo.toml', 'Engine/TinymistBridge/src/**', 'Engine/TinymistBridge/examples/**', 'Engine/SyntaxBridge/Cargo.toml', 'Engine/SyntaxBridge/src/**', 'scripts/tinymist-ipad*.patch', 'scripts/tinymist-vfs.patch', 'scripts/prepare-ipad-engine.sh') }}
          restore-keys: |
            ipad-${{ runner.os }}-${{ runner.arch }}-simulator-rust-1.92.0-xcode-26.3-
      - name: Cache Swift package sources
        id: swift-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/xcode-packages
          key: ipad-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Sources/Package.swift', 'iPad/**/Package.resolved') }}
      - name: Build simulator tests
        run: scripts/build-ipad.sh simulator
      # Save successful compilation before UI tests: a failing test must not
      # discard a 15-minute Rust build and force another cold build on retry.
      - name: Save compiled engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 5
        with:
          path: |
            .tools/cargo-ipad
            .tools/tinymist-ipad-source
            Engine/TinymistBridge/target
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Save resolved Swift packages
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: .build/xcode-packages
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
      # Keep executable permissions and symlinks inside an archive. Both UI
      # runners consume this one build, including its relocatable .xctestrun.
      - name: Archive compiled simulator tests
        timeout-minutes: 3
        run: |
          source scripts/environment.sh
          COPYFILE_DISABLE=1 tar -C build/iPad/Build -czf build/iPad-ui-tests.tar.gz Products
      - name: Upload compiled simulator tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 5
        with:
          name: ipad-ui-tests
          path: build/iPad-ui-tests.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  ipad-ui:
    name: iPad (${{ matrix.size }}, ${{ matrix.appearance }})
    needs: [changes, ipad-simulator-build]
    if: needs.changes.outputs.ipad == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Smoke runs one size; nightly and full dispatches cover both sizes and appearances.
        include: ${{ fromJSON(needs.changes.outputs.suite == 'smoke' && '[{"size":"11-inch","appearance":"light"}]' || '[{"size":"11-inch","appearance":"light"},{"size":"13-inch","appearance":"dark"}]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: appstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode for simulator services
        timeout-minutes: 1
        run: |
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Download compiled simulator tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        timeout-minutes: 3
        with:
          name: ipad-ui-tests
          path: build
      - name: Restore compiled simulator tests
        timeout-minutes: 2
        run: |
          source scripts/environment.sh
          mkdir -p build/iPad/Build
          tar -xzf build/iPad-ui-tests.tar.gz -C build/iPad/Build
      - name: Native tests and ${{ env.IPAD_SUITE }} UI suite
        timeout-minutes: ${{ env.IPAD_SUITE == 'smoke' && 20 || 50 }}
        run: |
          source scripts/environment.sh
          if [ "$IPAD_SUITE" = smoke ]; then
            suite=(--suite smoke --no-coverage)
          else
            suite=(--memory)
          fi
          python3 scripts/ipad_simulator.py --fresh-device --size "${{ matrix.size }}" \
            --appearance "${{ matrix.appearance }}" "${suite[@]}"
      - name: Upload native iPad test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 3
        with:
          name: ipad-writing-${{ matrix.size }}-${{ matrix.appearance }}
          path: build/iPad-writing
          if-no-files-found: warn
          retention-days: 14
  ipad-memory:
    name: iPad memory safety (${{ matrix.check }})
    # Reuse the Rust engine cached by the simulator build, off the UI path.
    needs: [changes, ipad-simulator-build]
    if: needs.changes.outputs.ipad == 'true' && needs.changes.outputs.suite == 'full'
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        check: [address, thread]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: appstore
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode for simulator services
        timeout-minutes: 1
        run: sudo xcode-select --switch "$DEVELOPER_DIR"
      - name: Reuse compiled Rust engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-ipad
            .tools/tinymist-ipad-source
            Engine/TinymistBridge/target
          key: ipad-${{ runner.os }}-${{ runner.arch }}-simulator-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/TinymistBridge/Cargo.lock', 'Engine/TinymistBridge/Cargo.toml', 'Engine/TinymistBridge/src/**', 'Engine/TinymistBridge/examples/**', 'Engine/SyntaxBridge/Cargo.toml', 'Engine/SyntaxBridge/src/**', 'scripts/tinymist-ipad*.patch', 'scripts/tinymist-vfs.patch', 'scripts/prepare-ipad-engine.sh') }}
          restore-keys: |
            ipad-${{ runner.os }}-${{ runner.arch }}-simulator-rust-1.92.0-xcode-26.3-
      - name: Reuse resolved Swift packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/xcode-packages
          key: ipad-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Sources/Package.swift', 'iPad/**/Package.resolved') }}
      - name: Build separate sanitizer test products
        timeout-minutes: 15
        run: scripts/build-ipad.sh simulator "${{ matrix.check }}"
      - name: Check Swift memory corruption and data races separately
        timeout-minutes: 25
        run: |
          source scripts/environment.sh
          python3 scripts/ipad_simulator.py --fresh-device --size 11-inch --suite unit --no-coverage \
            --derived-data "build/iPad-memory/${{ matrix.check }}" \
            --results "build/iPad-memory/${{ matrix.check }}-results"
      - name: Upload iPad sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipad-memory-${{ matrix.check }}
          path: build/iPad-memory/*-results
          if-no-files-found: warn
          retention-days: 14
  ipad-coverage:
    name: iPad 80% application coverage
    needs: [changes, ipad-ui]
    if: needs.changes.outputs.ipad == 'true' && needs.changes.outputs.suite == 'full'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download native test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ipad-writing-*
          path: build/iPad-results
      - name: Merge actual execution counts and require 80% coverage
        run: |
          source scripts/environment.sh
          python3 scripts/ipad_coverage.py --minimum 80 --result \
            build/iPad-results/ipad-writing-11-inch-light/11-inch.xcresult \
            build/iPad-results/ipad-writing-13-inch-dark/13-inch.xcresult
      # Codecov uploads are temporarily disabled while CLI downloads fail TLS handshakes.
      - name: Coverage summary
        if: always()
        run: |
          if [ -f build/iPad-coverage/summary.md ]; then
            cat build/iPad-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload iPad coverage diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipad-coverage
          path: build/iPad-coverage
          if-no-files-found: warn
          retention-days: 14
  gate:
    name: build and test
    needs: [changes, integration, appstore, memory, ipad-build, ipad-simulator-build, ipad-ui, ipad-coverage, ipad-memory]
    # Always report, so a failed, cancelled or wrongly skipped job fails the
    # required check instead of leaving it skipped (which GitHub treats as passing).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci_changes.py
          sparse-checkout-cone-mode: false
      # Each selected job must pass and every other job must be skipped:
      # path filters and the smoke suite skip jobs, never fail or cancel them.
      - name: Require every selected Mac and iPad job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_changes.py gate
