name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vMAJOR.MINOR.PATCH tag to retry both channels; empty = direct packaging only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and bilingual release message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Release contracts
        run: python3 scripts/test-appstore-release.py
      - name: Validate source version and tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TAGGED_RELEASE: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        run: |
          if [ "$TAGGED_RELEASE" = true ]; then
            python3 scripts/release_metadata.py check "$RELEASE_TAG"
          else
            git merge-base --is-ancestor HEAD origin/main
          fi
  lint:
    name: Swift lint (zero warnings)
    needs: validate
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Strict SwiftFormat and SwiftLint
        run: scripts/lint.sh
  package:
    name: Sign and notarize (Apple Silicon)
    needs: lint
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TAGGED_RELEASE: ${{ github.ref_type == 'tag' || inputs.tag != '' }}
        run: |
          if [ "$TAGGED_RELEASE" = true ]; then
            python3 scripts/release_metadata.py check "$RELEASE_TAG"
          fi
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release only commits already on main.' >&2; exit 1; }
      # Only the patched helper is cached; a miss (patch or script change) runs a
      # cold Rust build, saved before tests so a failing test does not repeat it.
      - name: Restore patched Tinymist
        id: tinymist-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/tinymist
            .tools/tinymist.stamp
          key: mac-tinymist-0.15.8-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-${{ hashFiles('scripts/build-tinymist.sh', 'scripts/tinymist-native-tls.patch', 'scripts/tinymist-vfs.patch') }}
      - name: Build patched Tinymist
        timeout-minutes: 40
        run: scripts/build-tinymist.sh
      - name: Save patched Tinymist
        if: steps.tinymist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: |
            .tools/tinymist
            .tools/tinymist.stamp
          key: ${{ steps.tinymist-cache.outputs.cache-primary-key }}
      - name: Functional integration tests and coverage gate
        run: scripts/test.sh
      - name: Sign, notarize and package app
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ICLOUD_PROVISIONING_PROFILE: ${{ secrets.ICLOUD_PROVISIONING_PROFILE }}
        run: scripts/release.sh
      - name: Include the shared release message
        if: github.ref_type == 'tag' || inputs.tag != ''
        run: cp build/release-metadata.md build/release/release-notes.md
      - name: Notarization result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notarization-result
          path: build/notarization
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-15
          path: build/release/*
          if-no-files-found: error
          retention-days: 7
  appstore:
    name: Sign, upload and submit to App Store
    needs: package
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    # Serialize all App Store versions, including manual retries of different tags.
    concurrency:
      group: appstore-production
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: appstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 scripts/release_metadata.py check "$RELEASE_TAG"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      # Only the patched helper is cached; a miss (patch or script change) runs a
      # cold Rust build, saved before tests so a failing test does not repeat it.
      - name: Restore patched Tinymist
        id: tinymist-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/tinymist
            .tools/tinymist.stamp
          key: mac-tinymist-0.15.8-${{ runner.os }}-${{ runner.arch }}-rust-1.92.0-${{ hashFiles('scripts/build-tinymist.sh', 'scripts/tinymist-native-tls.patch', 'scripts/tinymist-vfs.patch') }}
      - name: Build patched Tinymist
        timeout-minutes: 40
        run: scripts/build-tinymist.sh
      - name: Save patched Tinymist
        if: steps.tinymist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: |
            .tools/tinymist
            .tools/tinymist.stamp
          key: ${{ steps.tinymist-cache.outputs.cache-primary-key }}
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/repositories
            .build/checkouts
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
      - name: Test App Store distribution
        run: scripts/test.sh
      - name: Sign, upload, wait for processing and submit
        env:
          APPSTORE_DISTRIBUTION_P12: ${{ secrets.APPSTORE_DISTRIBUTION_P12 }}
          APPSTORE_INSTALLER_P12: ${{ secrets.APPSTORE_INSTALLER_P12 }}
          APPSTORE_CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
          APPSTORE_PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release-appstore.sh
      - name: Store package and submission proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appstore-${{ inputs.tag || github.ref_name }}
          path: |
            build/LeftBlank-AppStore.pkg
            build/release-metadata.json
            build/appstore-submission.json
            build/appstore-source.json
          if-no-files-found: ignore
          retention-days: 14
  publish:
    name: Publish GitHub release
    needs: [package, appstore]
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-15
          path: release
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false ]; then
              gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > release/published-assets.txt
              for asset in release/*.zip release/*.sha256; do
                grep -Fxq "$(basename "$asset")" release/published-assets.txt || { echo 'Published release is missing an expected asset.' >&2; exit 1; }
              done
              echo 'This release has already been published.'
              exit 0
            fi
            gh release upload "$RELEASE_TAG" release/*.zip release/*.sha256 --clobber
            gh release edit "$RELEASE_TAG" --draft=false --notes-file release/release-notes.md
          else
            gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 --verify-tag \
              --title "LeftBlank $RELEASE_TAG" --notes-file release/release-notes.md
          fi
