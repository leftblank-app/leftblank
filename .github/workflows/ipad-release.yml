name: iPad App Store release

on:
  push:
    tags: ['ipad-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable ipad-vMAJOR.MINOR.PATCH tag to retry upload and review'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ipad-appstore-production
  cancel-in-progress: false

jobs:
  release:
    name: Sign, upload and submit iPad App Store release
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
      checks: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      LEFTBLANK_DISTRIBUTION: appstore
      CARGO_BUILD_JOBS: 2
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate iPad source and offline release contracts
        run: |
          source scripts/environment.sh
          python3 scripts/test-ipad-release.py
          python3 scripts/test-ipad-storefront.py
          python3 scripts/ipad_release.py --tag "$RELEASE_TAG"
      - name: Strict Swift lint
        run: scripts/lint.sh
      - name: Cache embedded device engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cargo-ipad
            .tools/tinymist-ipad-source
            Engine/TinymistBridge/target
          key: ipad-${{ runner.os }}-${{ runner.arch }}-device-rust-1.92.0-xcode-26.3-${{ hashFiles('Engine/TinymistBridge/Cargo.lock', 'Engine/TinymistBridge/Cargo.toml', 'Engine/TinymistBridge/src/**', 'Engine/TinymistBridge/examples/**', 'scripts/tinymist-ipad*.patch', 'scripts/tinymist-vfs.patch', 'scripts/prepare-ipad-engine.sh') }}
          restore-keys: |
            ipad-${{ runner.os }}-${{ runner.arch }}-device-rust-1.92.0-xcode-26.3-
      - name: Cache iPad Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/xcode-packages
          key: ipad-swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.3-${{ hashFiles('Sources/Package.swift', 'iPad/**/Package.resolved') }}
      - name: Archive, export, upload and submit review
        env:
          APPSTORE_DISTRIBUTION_P12: ${{ secrets.APPSTORE_DISTRIBUTION_P12 }}
          APPSTORE_CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
          IPAD_APPSTORE_PROVISIONING_PROFILE: ${{ secrets.IPAD_APPSTORE_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release-ipad.sh
      - name: Upload signed package and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipad-appstore-${{ inputs.tag || github.ref_name }}
          path: |
            build/iPad-release/export/*.ipa
            build/iPad-release/export/*.plist
            build/iPad-release/source.json
            build/iPad-release/apple-status.json
            build/iPad-release/review-prepared.json
            build/appstore-submission.json
            build/appstore-source-ios.json
          if-no-files-found: warn
          retention-days: 14
