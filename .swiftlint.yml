# Formatting is owned by SwiftFormat. Curated correctness, performance and idiomatic rules from SwiftLint 0.64.1.
# Swift 6 only; preserve AppKit bridging, optional model values and Swift type
# inference. Do not mandate documentation, file naming/splitting, explicit access,
# deinit boilerplate or constant extraction for every literal.
# UTF-8 decoding is intentionally lossy for truncated snippets and infallible
# for JSONEncoder output; optional_data_string_conversion is not applicable.
# No baseline or per-file exclusions: warnings fail CI via --strict.
strict: true
included:
  - Package.swift
  - Sources
  - iPad/Sources
  - iPad/UITests
  - iPad/Tests
  - Tests
  - Benchmarks
  - scripts
  - design
